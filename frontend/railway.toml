[build]
builder = "DOCKERFILE"

[deploy]
# Empty startCommand to use Dockerfile CMD
startCommand = ""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
NODE_ENV = "production"
VITE_API_URL = "${{API_SERVICE_URL}}"
VITE_BACKEND_URL = "${{API_SERVICE_URL}}"
