[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run build && npx serve -s dist -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
NODE_ENV = "production"
VITE_API_URL = "${{API_SERVICE_URL}}"
VITE_BACKEND_URL = "${{API_SERVICE_URL}}"
# Frontend should NOT have LiveKit or OpenAI credentials!
# All API calls go through the API server
