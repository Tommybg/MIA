[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m livekit.agents.cli start --config-body '{\"env\": \"production\", \"log_level\": \"info\"}' agent.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
PYTHONPATH = "/app"
LIVEKIT_AGENT_ENV = "production"